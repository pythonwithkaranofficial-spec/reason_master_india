<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Circular Halo -->
  <circle cx="60" cy="60" r="54" fill="#F8FAFC" />
  <circle cx="60" cy="60" r="48" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Sheet Document in Background -->
  <rect x="36" y="24" width="48" height="64" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
  <line x1="44" y1="36" x2="68" y2="36" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />
  <line x1="44" y1="44" x2="76" y2="44" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />
  <line x1="44" y1="52" x2="64" y2="52" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />

  <!-- Precision Magnifying Glass Overlaid -->
  <circle cx="56" cy="56" r="22" fill="#EFF6FF" stroke="#1E40AF" stroke-width="3" />
  <circle cx="56" cy="56" r="16" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" />
  
  <!-- Centered Crosshair / Question Node inside Glass -->
  <circle cx="56" cy="56" r="3" fill="#F59E0B" />
  <line x1="56" y1="46" x2="56" y2="50" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" />
  <line x1="56" y1="62" x2="56" y2="66" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" />
  <line x1="46" y1="56" x2="50" y2="56" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" />
  <line x1="62" y1="56" x2="66" y2="56" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" />

  <!-- Magnifier Handle -->
  <line x1="72" y1="72" x2="92" y2="92" stroke="#1E40AF" stroke-width="6" stroke-linecap="round" />
  <line x1="74" y1="74" x2="90" y2="90" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
</svg>
