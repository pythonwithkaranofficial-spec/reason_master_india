<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Circular Halo -->
  <circle cx="60" cy="60" r="54" fill="#F8FAFC" />
  <circle cx="60" cy="60" r="48" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Clipboard Board Base -->
  <rect x="32" y="26" width="56" height="70" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" />
  <!-- Clipboard Metal Clamp -->
  <rect x="46" y="20" width="28" height="10" rx="4" fill="#64748B" />
  <circle cx="60" cy="25" r="2.5" fill="#FFFFFF" />

  <!-- Analytic Coordinate Axes -->
  <line x1="42" y1="46" x2="42" y2="82" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
  <line x1="42" y1="82" x2="78" y2="82" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />

  <!-- Awaiting Trajectory (Dashed Guide Arrow) -->
  <path d="M46 76 Q56 68 64 58 T74 48" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="3 3" fill="none" />
  <!-- Target Milestone Node Pin -->
  <circle cx="74" cy="48" r="4" fill="#F59E0B" />
  <circle cx="74" cy="48" r="1.5" fill="#FFFFFF" />
  
  <!-- Subtle Marker Points -->
  <circle cx="46" cy="76" r="2.5" fill="#94A3B8" />
  <circle cx="58" cy="64" r="2.5" fill="#94A3B8" />
</svg>
