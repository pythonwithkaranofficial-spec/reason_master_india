<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Rounded Base Container -->
  <rect width="64" height="64" rx="14" fill="#FEF3C7" />
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#FDE68A" stroke-width="1.5" />

  <!-- Railway Locomotive Front & Precision Rail Tracks -->
  <!-- Modern Aerodynamic Train Cab -->
  <path d="M22 16 Q32 13 42 16 L44 38 L20 38 Z" fill="#D97706" />
  <!-- Windshield -->
  <path d="M24 19 Q32 17 40 19 L41 27 L23 27 Z" fill="#FFFFFF" />
  <line x1="32" y1="18" x2="32" y2="27" stroke="#D97706" stroke-width="1.5" />
  <!-- Train Buffer Grille -->
  <rect x="23" y="31" width="18" height="4" rx="1" fill="#92400E" />
  <!-- Dual Headlights -->
  <circle cx="25" cy="35" r="2" fill="#FDE68A" />
  <circle cx="39" cy="35" r="2" fill="#FDE68A" />
  <!-- Lower Cowcatcher / Deflector -->
  <path d="M20 39 L44 39 L48 44 L16 44 Z" fill="#78350F" />
  <!-- Converging Rail Tracks -->
  <line x1="14" y1="52" x2="24" y2="44" stroke="#92400E" stroke-width="2.5" />
  <line x1="50" y1="52" x2="40" y2="44" stroke="#92400E" stroke-width="2.5" />
  <!-- Rail Sleepers -->
  <line x1="20" y1="46" x2="44" y2="46" stroke="#B45309" stroke-width="2" />
  <line x1="16" y1="50" x2="48" y2="50" stroke="#B45309" stroke-width="2" />
</svg>
