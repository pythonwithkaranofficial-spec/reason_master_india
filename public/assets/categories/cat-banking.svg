<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Rounded Base Container -->
  <rect width="64" height="64" rx="14" fill="#F0FDF4" />
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#DCFCE7" stroke-width="1.5" />

  <!-- Banking Vault / Fiscal Seal Geometry -->
  <!-- Outer Circular Vault Lock -->
  <circle cx="32" cy="32" r="18" fill="#15803D" />
  <circle cx="32" cy="32" r="14" fill="#F0FDF4" />
  <!-- Hexagonal Central Core -->
  <polygon points="32,22 39,26 39,36 32,40 25,36 25,26" fill="#16A34A" />
  <!-- Security Vault Notches -->
  <rect x="30.5" y="10" width="3" height="4" rx="1" fill="#15803D" />
  <rect x="30.5" y="50" width="3" height="4" rx="1" fill="#15803D" />
  <rect x="10" y="30.5" width="4" height="3" rx="1" fill="#15803D" />
  <rect x="50" y="30.5" width="4" height="3" rx="1" fill="#15803D" />
  <!-- Central Rupee / Logic Symbol Geometry -->
  <circle cx="32" cy="31" r="3" fill="#F59E0B" />
</svg>
